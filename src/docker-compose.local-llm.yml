services:
  pentagi:
    depends_on:
      ollama:
        condition: service_healthy
  ollama:
    image: ollama/ollama:latest
    container_name: pentagi-ollama
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ./ollama-data:/root/.ollama
    networks:
      - pentagi-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
